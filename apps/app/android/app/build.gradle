apply plugin: 'com.android.application'

android {
    namespace = "com.lexiduo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "27.1.12297006"
    defaultConfig {
        applicationId "com.lexiduo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17 -O3 -DNDEBUG"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePropsFile = file("keystore.properties")
            def keystoreProps = new Properties()
            if (keystorePropsFile.exists()) {
                keystoreProps.load(new FileInputStream(keystorePropsFile))
            }
            def defaultKsFile = file("${System.getProperty('user.home')}/.keystores/lexiduo-release.jks").exists() ?
                "${System.getProperty('user.home')}/.keystores/lexiduo-release.jks" : "release.jks"
            def ksFile = System.getenv("KEYSTORE_FILE") ?: keystoreProps.getProperty("storeFile") ?: defaultKsFile
            storeFile file(ksFile)
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword") ?: "password123"
            keyAlias System.getenv("KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias") ?: "my-alias"
            keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword") ?: "password123"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

task buildRustArm64(type: Exec) {
    description = "Compiles native Rust NDK library for aarch64-linux-android"
    workingDir file("src/main/rust")
    commandLine "cargo", "build", "--target", "aarch64-linux-android", "--release"
    doLast {
        def soSrc = file("src/main/rust/target/aarch64-linux-android/release/liblexiduo_rust.so")
        def jniDest = file("src/main/jniLibs/arm64-v8a/liblexiduo_rust.so")
        jniDest.parentFile.mkdirs()
        if (soSrc.exists()) {
            ant.copy(file: soSrc, tofile: jniDest)
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'mergeReleaseJniLibFolders' || task.name == 'mergeDebugJniLibFolders') {
        task.dependsOn buildRustArm64
    }
}
