[package]
name = "lexiduo_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "lexiduo_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
realfft = "3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
